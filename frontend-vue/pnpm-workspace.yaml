# frontend-vue is installed on its own (like frontend/), not as a member of the root workspace.
packages:
  - .

# vue-demi's postinstall only switches between Vue 2/3 builds; the default Vue 3 build is what we need.
ignoredBuiltDependencies:
  # esbuild's postinstall only re-checks the platform binary, which pnpm already installs as an
  # optional dependency.
  - esbuild
  - vue-demi
