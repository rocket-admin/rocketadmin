name: backend
on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
  pull_request:
    paths-ignore:
      - "frontend/**"
jobs:
  test:
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@v3
      - uses: extractions/setup-just@v1
      # `just test` under c8 (backend/.c8rc.json): same suite, plus the report copied out of the
      # container to backend/coverage/ for the two steps below.
      - name: run tests (with coverage)
        run: just test-coverage
        timeout-minutes: 50
      - name: coverage summary
        run: node scripts/coverage-report.mjs markdown backend backend/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage/coverage-summary.json
            backend/coverage/lcov.info
            backend/coverage/lcov-report
          if-no-files-found: error

  # Turns the coverage artifact into a Markdown report (metrics table) plus an SVG badge
  # (scripts/coverage-report.mjs, no dependencies, no external service) and force-pushes them —
  # with the raw summary — to the orphan `badges` branch as a single commit, with the workflow's
  # own GITHUB_TOKEN. README.md links to the report (a link never renders as a broken image; the
  # branch only exists after the first main build).
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage-artifact
      - name: render badge
        run: |
          set -euo pipefail
          mkdir -p badges
          node scripts/coverage-report.mjs badge coverage-artifact/coverage-summary.json badges/backend-coverage.svg "backend coverage"
          cp coverage-artifact/coverage-summary.json badges/backend-coverage-summary.json
          {
            echo "# Test coverage"
            echo
            echo "Generated by \`.github/workflows/backend.yml\` (job \`coverage-badge\`) for"
            echo "\`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ). Do not edit — every run replaces this branch."
            echo "Per-file detail: the \`coverage-backend\` artifact (lcov + HTML report) of that run."
            echo
            node scripts/coverage-report.mjs markdown backend badges/backend-coverage-summary.json
          } > badges/README.md
      - name: publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd badges
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "coverage badge for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges:badges
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: earthly/actions/setup-earthly@v1
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: extractions/setup-just@v1
      - name: license checker
        run: 'cd backend && npx license-checker --onlyAllow="MIT;ISC;Python-2.0;Apache-2.0;BSD;MPL;CC;Custom: http://github.com/dscape/statsd-parser;" --excludePrivatePackages'
